html,body{margin:0;height:100%;background:#11141c;color:#f3e7c9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
.wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 24px) 24px calc(env(safe-area-inset-bottom,0px) + 24px);box-sizing:border-box;text-align:center}

form{width:100%;max-width:320px}

#msg{min-height:22px;margin-top:16px;font-size:14px;line-height:1.45;max-width:340px}
.bar{width:100%;max-width:320px;height:8px;border-radius:9px;background:#2a3350;overflow:hidden;margin-top:14px;display:none}
.bar i{display:block;height:100%;width:0;background:#c9a961;transition:width .2s}
.erro{color:#ffb4a2}
.hint{font-size:12px;color:rgba(243,231,201,.55);margin-top:22px;max-width:320px;line-height:1.5}

<h1>Eurotrip 2026</h1><p class="sub">Família Merlini</p>
<form id="f" style="display:none" autocomplete="off">
<input id="s" type="password" placeholder="Senha da família" autocapitalize="off" autocorrect="off" spellcheck="false">
<button type="submit">Entrar</button>
<label class="lem"><input type="checkbox" id="lem" checked> Lembrar neste aparelho</label>
</form>
<div class="bar" id="bar"><i id="barin"></i></div>
<div id="msg"></div>
<div class="hint" id="hint" style="display:none">Na primeira vez o app baixa tudo (cerca de 25 MB) e depois funciona sem internet. Use Wi-Fi.</div>
</div>
<script>
(function(){
var DATA='data-v1', KEY='eurotrip-key', $=function(i){return document.getElementById(i)};
function msg(t,e){$('msg').innerHTML=t;$('msg').className=e?'erro':'';}
function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function ub64(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s);}
if(!window.crypto||!crypto.subtle||!window.DecompressionStream||!window.caches){msg('Este navegador é antigo demais para o app. Atualize o iOS (16.4 ou mais novo).',1);return;}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}
async function getMeta(){
  var c=await caches.open('meta');
  try{var r=await fetch('meta.json',{cache:'no-store'});if(!r.ok)throw new Error('meta');await c.put('meta.json',r.clone());return await r.json();}
  catch(e){var m=await c.match('meta.json');if(!m)throw e;return m.json();}
}
async function baixar(meta){
  var c=await caches.open(DATA),parts=[],tot=0,done=0;
  $('bar').style.display='block';$('hint').style.display='block';
  for(var i=0;i<meta.partes.length;i++){
    var u=meta.partes[i]+'?v='+meta.versao,r=await c.match(u);
    if(!r){msg('Baixando para usar sem internet…');var n=await fetch(u);if(!n.ok)throw new Error('download');await c.put(u,n.clone());r=n;}
    var buf=new Uint8Array(await r.arrayBuffer());parts.push(buf);done+=buf.length;
    $('barin').style.width=Math.round(100*done/meta.bytes)+'%';
  }
  var all=new Uint8Array(done),o=0;parts.forEach(function(p){all.set(p,o);o+=p.length;});
  var keep={};meta.partes.concat(meta.extras||[]).forEach(function(p){keep[p+'?v='+meta.versao]=1;});
  (meta.extras||[]).forEach(function(g){var u=g+'?v='+meta.versao;c.match(u).then(function(r){if(!r)fetch(u).then(function(n){if(n.ok)c.put(u,n)}).catch(function(){})})});
  var reqs=await c.keys();for(var j=0;j<reqs.length;j++){var x=new URL(reqs[j].url),p=x.pathname.replace(/^.*\//,'')+x.search;if(!keep[p])await c.delete(reqs[j]);}
  return all;
}
async function abrir(rawKey,meta){
  var key=await crypto.subtle.importKey('raw',rawKey,'AES-GCM',false,['decrypt']);
  var ct=await baixar(meta);msg('Abrindo…');
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(meta.iv)},key,ct);
  var html=await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  document.open();document.write(html);document.close();
}
async function derivar(senha,meta){
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(senha),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(meta.salt),iterations:meta.iter,hash:'SHA-256'},base,256));
}
async function start(){
  var meta;
  try{meta=await getMeta();}catch(e){msg('Sem internet e o app ainda não foi baixado neste aparelho. Abra uma vez com Wi-Fi.',1);return;}
  var salvo=null;try{salvo=localStorage.getItem(KEY);}catch(e){}
  if(salvo){var s=JSON.parse(salvo);if(s.salt===meta.salt){try{await abrir(b64(s.k),meta);return;}catch(e){}}}
  $('f').style.display='block';
  $('f').onsubmit=async function(ev){
    ev.preventDefault();var senha=$('s').value.trim();if(!senha)return;
    msg('Conferindo a senha…');
    try{var raw=await derivar(senha,meta);
      var key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
    }catch(e){msg('Não consegui conferir a senha neste aparelho.',1);return;}
    try{await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(meta.civ)},key,b64(meta.check));}
    catch(e){msg('Senha incorreta.',1);return;}
    try{if($('lem').checked)localStorage.setItem(KEY,JSON.stringify({salt:meta.salt,k:ub64(raw)}));}catch(e){}
    $('f').style.display='none';
    try{await abrir(raw,meta);}catch(e){try{localStorage.removeItem(KEY);}catch(x){}$('f').style.display='block';msg('Senha incorreta.',1);}
  };
}
start();
})();
</script></body></html>
